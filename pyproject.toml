[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvz-ize-sim"
version = "0.5.6"
description = "Deterministic offline IZE and IZC Who Will Win prediction simulator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pvz-ize = "pvz_ize.cli:main"

[tool.setuptools.packages.find]
include = ["pvz_ize*"]

[tool.setuptools.package-data]
pvz_ize = ["movement_tracks.json", "plant_animation_tracks.json", "web/*.html", "web/*.js", "web/*.css", "web/assets/*.png"]
